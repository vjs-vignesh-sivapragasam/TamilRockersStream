workflows:
  vflix-ios-build:
    name: VFlix iOS Build
    environment:
      node: "20"
      xcode: latest
      groups:
        - EXPO
    scripts:
      - name: Install dependencies
        script: |
          npm install --force
          chmod -R +x node_modules/.bin || true
          find node_modules -type f -name "hermesc*" -exec chmod +x {} + || true

      - name: Install Expo CLI
        script: npm install -g @expo/cli@latest --force

      - name: Extract app version from app.json
        script: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          APP_NAME=$(node -p "require('./app.json').expo.name.replace(/[^a-zA-Z0-9]/g, '')")
          echo "APP_VERSION=$APP_VERSION" >> $CM_ENV
          echo "APP_NAME=$APP_NAME" >> $CM_ENV
          echo "📱 Building: $APP_NAME v$APP_VERSION"

      - name: Prebuild iOS project
        script: |
          rm -rf ios android
          chmod -R +x node_modules/.bin || true
          find node_modules -type f -name "hermesc*" -exec chmod +x {} + || true

          export RCT_NEW_ARCH_ENABLED=1

          npx expo prebuild --clean --platform ios

          echo "✅ Prebuild complete"

      - name: Patch Podfile for New Architecture
        script: |
          cd ios

          # Fix deployment target
          sed -i 's/platform :ios, .*/platform :ios, "15.0"/' Podfile

          # Force New Architecture in Podfile
          cat >> Podfile << 'EOF'

          # Force New Architecture
          ENV['RCT_NEW_ARCH_ENABLED'] = '1'
          EOF

          echo "📝 Podfile patched:"
          cat Podfile

      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock

          export RCT_NEW_ARCH_ENABLED=1

          echo "📦 Installing CocoaPods..."
          pod install --repo-update

          echo "✅ CocoaPods installed successfully"

      - name: Build and create IPA
        script: |
          cd ios
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -1)

          if [ -z "$WORKSPACE" ]; then
            echo "❌ No .xcworkspace found"
            exit 1
          fi

          SCHEME_NAME=$(basename "$WORKSPACE" .xcworkspace)
          IPA_NAME="${APP_NAME}_v${APP_VERSION}"

          echo "🏗️ Building scheme: $SCHEME_NAME"
          mkdir -p build

          export RCT_NEW_ARCH_ENABLED=1

          # Build without code signing
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            RCT_NEW_ARCH_ENABLED=1

          # Find the .app
          APP_PATH=$(find build/DerivedData -name "${SCHEME_NAME}.app" -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found"
            find build/DerivedData -name "*.app" -type d || true
            exit 1
          fi

          echo "✅ Found .app at: $APP_PATH"

          # Package .app into .ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" "build/Payload/${SCHEME_NAME}.app"
          cd build
          zip -r "${IPA_NAME}.ipa" Payload
          rm -rf Payload

          IPA_SIZE=$(ls -lh "${IPA_NAME}.ipa" | awk '{print $5}')
          echo "✅ IPA created: ${IPA_NAME}.ipa (${IPA_SIZE})"

    artifacts:
      - ios/build/*.ipa

  vflix-android-build:
    name: VFlix Android Build
    environment:
      node: "20"
      java: 17
      vars:
        NODE_OPTIONS: "--max-old-space-size=8192"
      groups:
        - EXPO
    scripts:
      - name: Install dependencies
        script: |
          npm install --force
          chmod -R +x node_modules/.bin || true
          find node_modules -type f -name "hermesc*" -exec chmod +x {} + || true

      - name: Extract app version from app.json
        script: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          APP_NAME=$(node -p "require('./app.json').expo.name.replace(/[^a-zA-Z0-9]/g, '')")
          echo "APP_VERSION=$APP_VERSION" >> $CM_ENV
          echo "APP_NAME=$APP_NAME" >> $CM_ENV

      - name: Clean and generate Android project
        script: |
          set -e
          rm -rf ios android
          chmod -R +x node_modules/.bin || true
          find node_modules -type f -name "hermesc*" -exec chmod +x {} + || true
          npx expo prebuild --platform android --clean

      - name: Build and Sign Android APK
        script: |
          set -e
          export NODE_OPTIONS="--max-old-space-size=8192"

          # Fix permissions for hermesc compiler binaries before Gradle bundle step
          chmod -R +x node_modules/.bin || true
          find node_modules -type f -name "hermesc*" -exec chmod +x {} + || true

          cd android
          chmod +x gradlew || true
          ./gradlew assembleRelease -x configureCMakeRelease -Pandroid.overridePathCheck=true --stacktrace

          APK_NAME="${APP_NAME}_v${APP_VERSION}_release.apk"

          # Find the generated APK dynamically
          BUILT_APK=$(find app/build/outputs/apk -name "*.apk" | head -1)

          if [ -z "$BUILT_APK" ]; then
            echo "❌ No APK found in app/build/outputs/apk!"
            find app/build/outputs || true
            exit 1
          fi

          echo "📦 Found generated APK: $BUILT_APK"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)

          if [ -n "$CM_KEYSTORE" ]; then
            echo "🔐 Signing the APK with CM_KEYSTORE..."
            echo "$CM_KEYSTORE" | base64 --decode > /tmp/keystore.keystore
            $BUILD_TOOLS_DIR/apksigner sign \
              --ks /tmp/keystore.keystore \
              --ks-pass env:CM_KEYSTORE_PASSWORD \
              --ks-key-alias "$CM_KEY_ALIAS" \
              --key-pass env:CM_KEY_PASSWORD \
              --out "../$APK_NAME" \
              "$BUILT_APK"
            echo "✅ APK successfully signed with release keystore"
          else
            echo "⚠️ CM_KEYSTORE not found. Signing with debug keystore so APK can be installed on Android devices..."
            DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
            if [ ! -f "$DEBUG_KEYSTORE" ]; then
              mkdir -p "$HOME/.android"
              keytool -genkey -v -keystore "$DEBUG_KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            $BUILD_TOOLS_DIR/apksigner sign \
              --ks "$DEBUG_KEYSTORE" \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "../$APK_NAME" \
              "$BUILT_APK"
            echo "✅ APK successfully signed with debug keystore and ready for installation!"
          fi

          # Also copy the raw built APK as backup
          cp "$BUILT_APK" "../raw_$APK_NAME" || true

          echo "✅ Final APK ready at: $APK_NAME"
          ls -lh "../$APK_NAME"

    artifacts:
      - "*.apk"
      - android/app/build/outputs/**/*.apk

  vflix-android-debug:
    name: VFlix Android Debug Build
    environment:
      node: "20"
      java: 17
      vars:
        NODE_OPTIONS: "--max-old-space-size=8192"
      groups:
        - EXPO
    scripts:
      - name: Install dependencies
        script: |
          npm install --force
          chmod -R +x node_modules/.bin || true
          find node_modules -type f -name "hermesc*" -exec chmod +x {} + || true

      - name: Extract app version from app.json
        script: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          APP_NAME=$(node -p "require('./app.json').expo.name.replace(/[^a-zA-Z0-9]/g, '')")
          echo "APP_VERSION=$APP_VERSION" >> $CM_ENV
          echo "APP_NAME=$APP_NAME" >> $CM_ENV

      - name: Clean and generate Android project
        script: |
          set -e
          rm -rf ios android
          chmod -R +x node_modules/.bin || true
          find node_modules -type f -name "hermesc*" -exec chmod +x {} + || true
          npx expo prebuild --platform android --clean

      - name: Build Android Debug APK
        script: |
          set -e
          chmod -R +x node_modules/.bin || true
          find node_modules -type f -name "hermesc*" -exec chmod +x {} + || true

          cd android
          chmod +x gradlew || true
          ./gradlew assembleDebug -x configureCMakeDebug -Pandroid.overridePathCheck=true --stacktrace

          APK_NAME="${APP_NAME}_v${APP_VERSION}_debug.apk"
          BUILT_APK=$(find app/build/outputs/apk -name "*.apk" | head -1)

          if [ -z "$BUILT_APK" ]; then
            echo "❌ No debug APK found!"
            find app/build/outputs || true
            exit 1
          fi

          cp "$BUILT_APK" "../$APK_NAME"
          echo "✅ Debug APK created: $APK_NAME"
          ls -lh "../$APK_NAME"

    artifacts:
      - "*.apk"
      - android/app/build/outputs/**/*.apk
